{% if static_theme_toggle|default(false) %}
<button type="button" data-static-theme-toggle class="lv-theme-switch" aria-label="切換明亮或深色模式" title="切換明亮或深色模式" aria-pressed="false">
{% else %}
<button type="button" @click="toggleDarkMode" data-theme-toggle class="lv-theme-switch" :aria-label="isDarkMode ? '切換為明亮模式' : '切換為深色模式'" :title="isDarkMode ? '切換為明亮模式' : '切換為深色模式'" :aria-pressed="isDarkMode">
{% endif %}
    <svg class="lv-theme-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
    <svg class="lv-theme-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg>
    <span class="lv-theme-light">明亮</span><span class="lv-theme-dark">深色</span>
</button>
{% if static_theme_toggle|default(false) %}<script src="{{ url_for('static', filename='js/appearance-toggle.js', v='orange-1') }}" defer></script>{% endif %}
