<!-- Mobile workspace actions; all recording tools remain in the details panel. -->

    <button @click="toggleSidebar"><i class="fas fa-bars" aria-hidden="true"></i><span>錄音庫</span></button>
    <button @click="mobileTab = 'transcript'" :aria-current="mobileTab === 'transcript' ? 'page' : null"><i class="fas fa-align-left" aria-hidden="true"></i><span>逐字稿</span></button>
    <button @click="openSpeakerModal" :disabled="!processedTranscription.hasDialogue"><i class="fas fa-user-tag" aria-hidden="true"></i><span>人物辨識</span></button>
    <button @click="isMetadataExpanded = !isMetadataExpanded" :aria-expanded="isMetadataExpanded"><i class="fas fa-sliders" aria-hidden="true"></i><span>錄音詳情</span></button>
