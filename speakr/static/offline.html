<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

        :root { color-scheme: light dark; }

        .wordmark { font-size: 23px; font-weight: 800; letter-spacing: -1px; }
        .eyebrow { font: 10px ui-monospace, monospace; letter-spacing: 1.5px; color: #7d6a5c; margin-top: 44px; }
        h1 { font-size: 32px; letter-spacing: -1px; }
        p { color: #7d6a5c; font-size: 14px; line-height: 1.9; }

</head>
